<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boogie Cards Catalogus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
.wrap{padding-bottom:40px!important}
.card{cursor:default}
.card:hover{transform:none}
.price .hp small{display:none}
.upd{font-size:.78rem;color:var(--page-muted);margin:4px 2px 10px}
.lb{position:fixed;inset:0;z-index:30;background:rgba(12,10,25,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:72vh;border-radius:18px;border:6px solid var(--gold);background:var(--surface)}
.lb p{color:#fff;font-weight:700;text-align:center}
.foot{font-size:.78rem;color:var(--page-muted);text-align:center;margin:18px 0 0}
/* Layout: één kolom als een verzamelmap. Donkerblauwe binder als achtergrond met een naad in het midden,
   een rode booster-kop met gekartelde rand, en elke kaart in de lijst als een echte kaart met geel kader.
   Bewust één (donker) thema: de kaarten zelf zijn licht, de map is donker. */
:root{
  color-scheme:light;
  /* binder (pagina) */
  --page:#efe3c8; --page-2:#e3d3b0; --page-fg:#2b2040; --page-muted:#6f6150; --page-line:rgba(70,50,20,.18); --berry:#8c1c2b;
  /* kaartvlak (kaarten, vensters) */
  --surface:#faf3e2; --sunk:#f0e5ca; --fg:#1b1f38; --muted:#6c6550; --line:#e4d6ad; --field:#ffffff;
  --gold:#f7c51e; --gold-deep:#d9a400; --accent:#f7c51e; --accent-ink:#1b1f38;
  --good:#1f9d55; --bad:#e3350d;
  --fire:#e3350d; --water:#3b6cc8; --grass:#3fa34d; --volt:#f7c51e; --psy:#a14fd0; --fight:#c0602a; --dark:#4b4f66;
  --pack1:#2f4170; --pack2:#223258; --pack3:#18233f;
  --foil:linear-gradient(115deg,#ffe58a 0%,#ffb3d9 22%,#a5e8ff 44%,#c6ffb0 62%,#ffd27a 80%,#ffb3d9 100%);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{color:var(--page-fg);font-family:var(--body);font-size:15px;line-height:1.45;
  background-color:var(--page);
  background-image:
    linear-gradient(90deg,transparent calc(50% - 3px),rgba(90,60,20,.14) calc(50% - 1px),rgba(255,255,255,.35) calc(50% + 1px),transparent calc(50% + 3px)),
    radial-gradient(circle at 1px 1px,rgba(90,60,20,.07) 1px,transparent 1.6px),
    linear-gradient(180deg,var(--page),var(--page-2));
  background-size:100% 100%,6px 6px,100% 100%;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--page)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}

/* Booster-kop met gekartelde onderrand */
.pack{position:relative;border-radius:24px;padding:20px 18px 18px;color:#fff;margin-bottom:14px;
  background:linear-gradient(180deg,var(--pack1),var(--pack2) 60%,var(--pack3));box-shadow:0 14px 26px rgba(20,30,60,.28)}
.pack::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 14px);pointer-events:none}
.pack>*{position:relative;z-index:1}
.pack-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.02;letter-spacing:-.015em;margin:0;text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.22)}
.sub{margin:6px 0 0;opacity:.85;max-width:44ch;font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.spark{position:absolute;width:14px;height:14px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:.7}
.spark.gold{background:var(--gold);opacity:.95}
.tstar{display:inline-block;width:.62em;height:.62em;margin-left:.18em;vertical-align:.55em;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.btn.ghost{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:1.08rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85}

/* Balk met tabs, zoeken en sorteren, op de binder */
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;margin-bottom:12px;padding:12px;border-radius:24px;display:flex;flex-direction:column;gap:8px;
  background:rgba(250,243,226,.96);border:6px solid var(--gold);box-shadow:inset 0 0 0 1px var(--gold-deep),0 6px 18px rgba(70,45,10,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(70,50,20,.07);border:1px solid var(--page-line);border-radius:999px;padding:4px;gap:4px}
.tab{font:inherit;font-weight:700;padding:9px;border-radius:999px;border:0;background:transparent;color:var(--page-muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--gold);color:var(--accent-ink);box-shadow:0 3px 0 var(--gold-deep)}
.search{width:100%;font:inherit;font-size:1rem;padding:12px 18px;border-radius:999px;border:3px solid var(--gold);background:var(--surface);color:var(--fg)}
.search::placeholder{color:var(--muted)}
.search:focus,button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--page-fg);outline-offset:2px}
.sort{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.82rem;font-weight:700;padding:6px 12px;border-radius:999px;border:1.5px solid var(--page-line);background:rgba(255,255,255,.55);color:var(--page-fg);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.searchrow{display:flex;gap:8px;align-items:center}
.searchrow .search{flex:1;min-width:0}
.fbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:48px;min-width:48px;padding:0 14px;border-radius:999px;border:3px solid var(--gold);background:var(--surface);color:var(--fg);cursor:pointer;font:inherit;font-weight:800;font-size:.8rem}
.fbtn[aria-expanded="true"]{border-color:var(--fg)}
.fbtn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold-deep);color:var(--accent-ink);box-shadow:0 3px 0 var(--gold-deep)}
.fbtn span{max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kinds{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-radius:18px;background:rgba(70,50,20,.06);border:1px dashed var(--page-line)}
.kinds .chip{font-size:.8rem;padding:6px 12px}
.kinds{flex-direction:column;gap:8px}
.krow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.klab{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:100%}
.nrg.game{background:var(--fg);color:var(--surface)} .nrg.g-magic{background:#6b4b2a} .nrg.g-onepiece{background:#b3261e} .nrg.g-yugioh{background:#5a3f8f} .nrg.g-lorcana{background:#2b5fa8}
.sheet .chip{background:var(--field);color:var(--fg);border-color:var(--line)}

/* Kaarten in de lijst */
.list{display:flex;flex-direction:column;gap:12px}
.card{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;
  background:var(--surface);color:var(--fg);border:6px solid var(--gold);border-radius:20px;padding:10px 14px 10px 16px;
  box-shadow:inset 0 0 0 1px var(--gold-deep),0 5px 12px rgba(70,45,10,.22);cursor:pointer;width:100%;text-align:left;overflow:hidden;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--page-fg);outline-offset:2px}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--line)}
.card.m-good::before{background:var(--good)} .card.m-tight::before{background:var(--volt)} .card.m-bad::before{background:var(--bad)} .card.m-none::before{background:var(--line)}
.thumb{position:relative;width:52px;height:72px;border-radius:10px;padding:3px;background:#c9c5b8;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.thumb span{display:grid;place-items:center;height:100%;border-radius:7px;background:var(--sunk);font-family:var(--mono);font-size:.68rem;color:var(--muted);position:relative;z-index:1}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;border-radius:7px;position:relative;z-index:1}
.thumb.t-rare{background:linear-gradient(160deg,var(--water),#24479a)}
.thumb.t-foil{background:var(--foil)}
.thumb.t-rev span{background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,var(--surface) 4px 8px)}
.card.sold{filter:saturate(.6)}.card.sold .thumb{filter:grayscale(.8)}
.name{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.15;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.nrg{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:999px;font-size:.66rem;font-weight:800;color:#fff;letter-spacing:.02em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.nrg.c-MT,.nrg.c-NM{background:var(--grass)} .nrg.c-EX{background:var(--water)} .nrg.c-GD{background:var(--volt);color:var(--fg)}
.nrg.c-LP{background:var(--fight)} .nrg.c-PL,.nrg.c-PO{background:var(--fire)} .nrg.lang{background:var(--dark)} .nrg.var{background:var(--psy)}
.price{text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end}
.price .hp{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1;color:var(--berry)}
.price .hp small{font-family:var(--body);font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--berry);margin-right:3px;display:inline}
.price small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted)}
.price small.pos,.price small.neg{font-weight:800}
.price .qsell{margin-top:6px;font:inherit;font-family:var(--body);font-size:.75rem;font-weight:800;padding:5px 11px;border-radius:999px;border:2px solid var(--fg);background:var(--gold);color:var(--accent-ink);cursor:pointer}
.qty{font-family:var(--mono);font-size:.74rem;background:var(--fg);color:var(--surface);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.tag{font-family:var(--body);font-size:.68rem;font-weight:700;border-radius:6px;padding:1px 6px;border:1.5px solid currentColor;margin-left:6px;white-space:nowrap;vertical-align:2px}
.tag.todo{color:var(--berry)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--page-muted);margin:0 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.empty{background:var(--surface);color:var(--muted);border:6px solid var(--gold);border-radius:20px;padding:24px}
.empty h2{font-family:var(--display);color:var(--fg);margin:0 0 6px;font-size:1.25rem}
.note{font-size:.85rem;color:var(--muted);margin:8px 0}
.wrap>.note{color:var(--page-muted)}
.chartbox{background:var(--surface);color:var(--fg);border:6px solid var(--gold);border-radius:20px;padding:14px 12px 8px;margin-bottom:4px}
.chartbox h2{font-family:var(--display);font-size:1.05rem;margin:0 0 4px}
.chartbox .legend{color:var(--muted)}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chartbox text.v{fill:var(--fg);font-family:var(--mono);font-size:10px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;font:inherit;font-weight:800;font-size:1rem;padding:14px 26px;border-radius:999px;border:3px solid var(--fg);background:var(--gold);color:var(--accent-ink);box-shadow:0 5px 0 var(--fg),0 10px 24px rgba(0,0,0,.4);cursor:pointer}
.fab:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 var(--fg)}
.fab svg{width:20px;height:20px}

/* Vensters: een kaartvlak met geel kader bovenaan */
.sheet-bg{position:fixed;inset:0;background:rgba(12,6,30,.68);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;border:6px solid var(--gold);border-bottom:0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0 0 4px;text-wrap:balance}
.sheet h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--berry);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.sheet h3::after{content:"";flex:1;height:2px;background:var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:0}
label input,label select{font:inherit;font-size:1rem;text-transform:none;letter-spacing:0;color:var(--fg);background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;color-scheme:light}
.sheet input:focus-visible,.sheet select:focus-visible,.sheet button:focus-visible,.sheet a:focus-visible{outline-color:var(--water)}
.prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.prices div{background:var(--sunk);border-radius:14px;padding:10px;min-width:0;border-left:5px solid var(--water)}
.prices div:nth-child(2){border-left-color:var(--berry)}.prices div:nth-child(3){border-left-color:var(--grass)}
.prices b{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.05rem}
.prices span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tblwrap{overflow-x:auto}
table.margin{width:100%;border-collapse:collapse;font-size:.9rem}
table.margin th{text-align:left;font-weight:700;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:2px solid var(--line)}
table.margin td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.margin td.n,table.margin th.n{text-align:right;font-family:var(--mono)}
table.margin tr.hl td{font-weight:700;background:rgba(247,197,30,.22)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-weight:700;padding:11px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--gold);border:2px solid var(--fg);color:var(--accent-ink);box-shadow:0 3px 0 var(--fg)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
a.link{color:var(--water);font-weight:700}
.photo{max-width:100%;max-height:220px;border-radius:14px;display:block;margin:10px auto;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.bigphoto{display:block;max-width:100%;max-height:340px;margin:4px auto 12px;border-radius:18px;border:5px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.status{padding:10px 14px;border-radius:14px;background:var(--sunk);font-size:.9rem;border-left:5px solid var(--volt)}
.soldbox{background:var(--sunk);border-radius:16px;padding:12px;margin-top:10px}
@media (max-width:420px){h1{font-size:1.85rem}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat:first-child{grid-column:1/-1}.prices{grid-template-columns:repeat(2,minmax(0,1fr))}.card{grid-template-columns:46px minmax(0,1fr) auto;gap:10px}.thumb{width:46px;height:64px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header class="pack">
    <i class="spark" style="top:14px;right:22%" aria-hidden="true"></i>
    <i class="spark gold" style="top:10px;left:6px;width:9px;height:9px" aria-hidden="true"></i>
    <i class="spark gold" style="top:44px;right:14%;width:12px;height:12px" aria-hidden="true"></i>
    <i class="spark" style="top:58%;right:8%;width:10px;height:10px" aria-hidden="true"></i>
    <div class="pack-top"><div style="min-width:0">
      <h1>Boogie Cards<span class="tstar" aria-hidden="true"></span></h1>
      <p class="sub">Van verzamelaar tot verzamelaar</p>
    </div></div>
    <section class="stats" aria-label="Overzicht"><div class="stat"><span>Kaarten te koop</span><b id="sCount">0</b></div></section>
  </header>

  <div class="bar">
    <div class="searchrow">
      <input id="q" class="search" type="search" placeholder="Zoek op naam, set of nummer…" autocomplete="off" aria-label="Zoek een kaart">
      <button class="fbtn" id="ftoggle" type="button" aria-expanded="false" aria-controls="kinds" aria-pressed="false" aria-label="Filter op soort kaart"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg><span id="fbadge" hidden></span></button>
    </div>
    <div class="sort" role="group" aria-label="Sorteren">
      <button class="chip" data-sort="value" aria-pressed="true">Duurste eerst</button>
      <button class="chip" data-sort="cheap" aria-pressed="false">Goedkoopste eerst</button>
      <button class="chip" data-sort="name" aria-pressed="false">Naam</button>
      <button class="chip" data-sort="set" aria-pressed="false">Set</button>
    </div>
    <div class="kinds" role="group" aria-label="Soort kaart" id="kinds" hidden></div>
  </div>
  <p class="upd" id="upd"></p>
  <div id="list" class="list"></div>
  <p class="foot">Prijzen zijn vraagprijzen per stuk. Interesse? Spreek ons aan of stuur ons een bericht.<br><b>Wil je kaarten verkopen?</b> Spreek ons aan, we doen je een eerlijk bod.</p>
</div>

const KINDS=[["all","Alles"],["holo","Holo"],["reverse","Reverse holo"],["normal","Niet-holo"],["ex","ex"],["gx","GX"],["v","V / VMAX / VSTAR"],["art","Full Art & Illustration"],["promo","Promo"]];
function kindOf(c,k){ const n=String(c.name||""), r=String(c.rarity||"").toLowerCase(), s=String(c.set||"").toLowerCase();
  switch(k){ case "all": return true; case "holo": return c.variant==="holo"; case "reverse": return c.variant==="reverse";
    case "normal": return !c.variant||c.variant==="normal"; case "ex": return /\bex\b/i.test(n);
    case "gx": return /\bGX\b/.test(n); case "v": return /\bV(MAX|STAR|UNION)?\b/.test(n);
    case "art": return c.variant==="altart"||/illustration|full art|alternate|secret|rainbow|special|hyper|gold|mythic|manga|parallel|showcase|borderless|enchanted|\bsec\b/.test(r)||/full art/i.test(n);
    case "promo": return /promo/.test(r)||/promo/.test(s); } return true; }
let kind="all";
function kindChips(){
  const present=[...new Set((typeof cards!=="undefined"?cards:[]).map(c=>c.game||"pokemon"))];
  const gs=GAMES.filter(g=>present.includes(g[0]));
  const gameRow = gs.length>1 ? `<div class="krow"><span class="klab">Spel</span>${[["all","Alle spellen"],...gs.map(g=>[g[0],g[1]])].map(([k,l])=>`<button class="chip kind" data-game="${k}" aria-pressed="${k===game}">${l}</button>`).join("")}</div>` : "";
  return gameRow + `<div class="krow"><span class="klab">Soort</span>${KINDS.map(([k,l])=>`<button class="chip kind" data-kind="${k}" aria-pressed="${k===kind}">${l}</button>`).join("")}</div>`; }

function tier(c){ const r=String(c.rarity||"").toLowerCase();
  if(/illustration|special|hyper|secret|alternate|ultra|gold|full art|rainbow|\bex\b|\bvmax\b|\bvstar\b/.test(r)) return "foil";
  if(c.variant==="reverse") return "rev"; if(/rare|holo|double/.test(r)||c.variant==="holo") return "rare"; return "common"; }
function render(){
  $("#sCount").textContent=cards.reduce((a,c)=>a+(c.qty||1),0);
  $("#upd").textContent=data.updated?"Bijgewerkt op "+new Date(data.updated).toLocaleDateString("nl-BE",{day:"numeric",month:"long",year:"numeric"})+".":"";
  const q=$("#q").value.trim().toLowerCase();
  let rows=cards.filter(c=>(!q||[c.name,c.set,c.number].join(" ").toLowerCase().includes(q))&&kindOf(c,kind)&&(game==="all"||(c.game||"pokemon")===game));
  const by={value:(a,b)=>(b.price??-1)-(a.price??-1),cheap:(a,b)=>(a.price??1e12)-(b.price??1e12),
    name:(a,b)=>String(a.name).localeCompare(String(b.name),"nl"),
    set:(a,b)=>String(a.set).localeCompare(String(b.set),"nl")||String(a.number).localeCompare(String(b.number),"nl",{numeric:true})}[sortBy];
  rows.sort(by);
  if(!cards.length){ $("#list").innerHTML='<div class="empty"><h2>Binnenkort nieuwe kaarten</h2>Hier verschijnen de kaarten die we te koop hebben, met hun prijs en staat.</div>'; return; }
  if(!rows.length){ $("#list").innerHTML=`<div class="empty"><h2>Niet gevonden</h2>Geen kaart${kind!=="all"?` in “${esc(KINDS.find(x=>x[0]===kind)[1])}”`:""}${q?` voor “${esc(q)}”`:""}. Vraag ons gerust, misschien hebben we hem nog liggen.</div>`; return; }
  $("#list").innerHTML=rows.map(c=>{ const cond=esc(c.condition||"NM"); const v=c.variant;
    return `<div class="card"${(c.photo||c.official)?` role="button" tabindex="0" data-i="${cards.indexOf(c)}" style="cursor:zoom-in"`:""}>
      <div class="thumb t-${tier(c)}">${c.official?`<img src="${c.official}/low.webp" loading="lazy" alt="${esc(c.name)}" data-i="${cards.indexOf(c)}" onerror="imgFallback(this)">`:c.photo&&/^(data:image\/|fotos\/[a-z0-9]+\.jpg$)/.test(c.photo)?`<img src="${c.photo}" alt="Foto van ${esc(c.name)}">`:`<span>${esc(c.number||"?")}</span>`}</div>
      <div style="min-width:0">
        <div class="name">${esc(c.name)}${(c.qty||1)>1?`<span class="qty">×${c.qty}</span>`:""}</div>
        <div class="meta">${(c.game||"pokemon")!=="pokemon"?`<span class="nrg game g-${esc(c.game)}">${esc(gameOf(c)[1])}</span>`:""}<span>${esc(c.set||"")} · ${esc(c.number||"?")}</span><span class="nrg c-${cond}">${cond}</span><span class="nrg lang">${esc(c.lang||"EN")}</span>${v&&v!=="normal"?`<span class="nrg var">${v==="reverse"?"REV":v==="firstEdition"?"1ST":v==="altart"?"ALT ART":((c.game||"pokemon")==="pokemon"?"HOLO":"FOIL")}</span>`:""}</div>
      </div>
      <div class="price"><span class="hp">${eur(c.price)}</span></div>
    </div>`; }).join("");
}
$("#q").addEventListener("input",render);
$("#kinds").innerHTML=kindChips();
const fbtn=$("#ftoggle");
function fLabel(){ const k=KINDS.find(x=>x[0]===kind), gm=GAMES.find(x=>x[0]===game); const on=kind!=="all"||game!=="all"; const lab=[game!=="all"?gm[1]:"",kind!=="all"?k[1]:""].filter(Boolean).join(" · "); fbtn.setAttribute("aria-pressed",String(on)); $("#fbadge").hidden=!on; $("#fbadge").textContent=lab; const k1={1:lab}; fbtn.setAttribute("aria-label", on?`Filter: ${lab}. Tik om te wijzigen`:"Filter op soort kaart"); }
fLabel();
fbtn.onclick=()=>{ const open=$("#kinds").hidden; if(open) $("#kinds").innerHTML=kindChips(); $("#kinds").hidden=!open; fbtn.setAttribute("aria-expanded",String(open)); };
$("#kinds").addEventListener("click",e=>{ const g=e.target.closest("[data-game]"), b=e.target.closest("[data-kind]");
  if(g){ game=g.dataset.game; } else if(b){ kind=b.dataset.kind; } else return;
  $("#kinds").innerHTML=kindChips(); if(b){ $("#kinds").hidden=true; fbtn.setAttribute("aria-expanded","false"); } fLabel(); render(); });
function imgFallback(el){ const c=cards[+el.dataset.i]; el.onerror=null; if(c&&c.photo&&/^(data:image\/|fotos\/[a-z0-9]+\.jpg$)/.test(c.photo)){ el.src=c.photo; } else { el.replaceWith(Object.assign(document.createElement("span"),{textContent:(c&&c.number)||"?"})); } if(c) c.official=null; }
function openLb(i){ const c=cards[i]; if(!c||!(c.photo||c.official)) return; const im=$("#lbImg"); im.onerror=()=>{ im.onerror=null; if(c.photo) im.src=c.photo; }; im.src=c.official?c.official+"/high.webp":c.photo; $("#lbImg").alt="Foto van "+c.name; $("#lbCap").textContent=`${c.name} · ${c.set||""} · ${eur(c.price)}`; $("#lb").hidden=false; }
$("#list").addEventListener("click",e=>{ const el=e.target.closest(".card[data-i]"); if(el) openLb(+el.dataset.i); });
$("#list").addEventListener("keydown",e=>{ const el=e.target.closest(".card[data-i]"); if(el&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); openLb(+el.dataset.i); } });
$("#lbClose").onclick=()=>{ $("#lb").hidden=true; };
$("#lb").addEventListener("click",e=>{ if(e.target.id==="lb") $("#lb").hidden=true; });
document.querySelectorAll("[data-sort]").forEach(b=>b.addEventListener("click",()=>{ sortBy=b.dataset.sort; document.querySelectorAll("[data-sort]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); render(); }));
render();
</script>

</body>
</html>
